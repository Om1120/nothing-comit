<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masala Movie</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">

    <style>
        body {
            background-color: #2c2c2c;
            color: white;
        }

        /* Logo Bar */
        .logo-bar {
            background-color: #3a3a3a;
            padding: 15px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        /* Navbar */
        .navbar {
            background-color: #444;
        }

        .btn-custom {
            border-radius: 25px;
            padding: 8px 20px;
            margin: 5px;
        }

        /* Footer */
        .footer {
            background-color: #3a3a3a;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        .footer h2 {
            font-weight: bold;
            letter-spacing: 2px;
        }

        .footer p {
            margin: 5px 0;
            color: #ccc;
        }

        .footer a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer a:hover {
            color: #ffc107;
        }

        /* Contact Form */
        .contact-box input,
        .contact-box textarea {
            background-color: #3a3a3a;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
        }

        .contact-box textarea {
            border-radius: 20px;
        }

        .contact-box input::placeholder,
        .contact-box textarea::placeholder {
            color: #bbb;
        }
    </style>
</head>

<body>

    <!-- Logo -->
    <div class="logo-bar">
        <div class="logo">MASALA MOVIES</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-3">
        <div class="container-fluid">

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active"
                            href="http://127.0.0.1:5500/moviesite/html/landingpage.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link"
                            href="http://127.0.0.1:5500/moviesite/html/bollywood.html">Bollywood</a></li>
                    <li class="nav-item"><a class="nav-link"
                            href="http://127.0.0.1:5500/moviesite/html/hollywood.html">Hollywood</a></li>
                    <li class="nav-item"><a class="nav-link"
                            href="http://127.0.0.1:5500/moviesite/html/dualaudiocontent.html">Dual Audio</a></li>
                    <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5500/moviesite/html/tvshow.html">TV
                            Shows</a></li>
                </ul>

                <form class="d-flex ms-auto">
                    <input class="form-control me-2" type="search" placeholder="Find your masala">
                    <button class="btn btn-warning">SEARCH</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Buttons -->
    <div class="container text-center mt-4">
        <a href="http://127.0.0.1:5500/moviesite/html/bollywood.html" class="btn btn-success btn-custom">Bollywood
            Movies</a>
        <a href="http://127.0.0.1:5500/moviesite/html/dualaudiocontent.html" class="btn btn-danger btn-custom">Dual
            Audio Content</a>
        <a href="http://127.0.0.1:5500/moviesite/html/hollywood.html" class="btn btn-warning btn-custom">Hollywood
            Movies</a>
        <a href="http://127.0.0.1:5500/moviesite/html/tvshow.html" class="btn btn-info btn-custom">TV Show</a>
    </div>

    <!-- Contact Form -->
    <div class="container mt-5 mb-5 contact-box">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">

                <h2 class="mb-4">SEND US A MESSAGE</h2>

                <form>
                    <input type="text" class="form-control mb-3" placeholder="Full Name">
                    <input type="email" class="form-control mb-3" placeholder="E-mail">
                    <input type="text" class="form-control mb-3" placeholder="Phone">
                    <textarea class="form-control mb-3" rows="5" placeholder="Your Message"></textarea>

                    <button type="submit" class="btn btn-warning px-4" style="border-radius:25px;">
                        SEND
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <h2>MASALA MOVIES</h2>
        <p>Copyright © 2026. Created by Masala Movies Team</p>
        <p>
            <a href="http://127.0.0.1:5500/moviesite/html/contactus.html">Contact Us</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="../js/bootstrap.bundle.min.js"></script>

</body>

</html>
