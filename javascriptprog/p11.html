<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var rows = prompt("Enter number of rows:");

        for (var i = 1; i <= rows; i++) {

            for (var j = rows - i + 1; j <= rows; j++) {
                document.write(j);
            }

            document.write("<br/>");
        }

    </script>
</body>

</html>
