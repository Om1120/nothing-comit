<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>

<body>

    <table align="center" border="2" cellpadding="10">
        <tr>
            <th colspan="1">Student Result</th>
        </tr>

        <tr>
            <td>NAME: <input type="text" id="name"></td>
        </tr>

        <tr>
            <td>MATHS: <input type="number" id="sub1"></td>
        </tr>

        <tr>
            <td>SCIENCE: <input type="number" id="sub2"></td>
        </tr>

        <tr>
            <td>GUJARATI: <input type="number" id="sub3"></td>
        </tr>

        <tr>
            <td>HINDI: <input type="number" id="sub4"></td>
        </tr>

        <tr>
            <td align="center">
                <button onclick="show()">Submit</button>
            </td>
        </tr>
    </table>
    <div id="result" style="text-align:center; margin-top:20px;"></div>

    <script>
        function show() {

            let name = document.getElementById("name").value;

            let sub1 = parseInt(document.getElementById("sub1").value) || 0;
            let sub2 = parseInt(document.getElementById("sub2").value) || 0;
            let sub3 = parseInt(document.getElementById("sub3").value) || 0;
            let sub4 = parseInt(document.getElementById("sub4").value) || 0;

            let total = sub1 + sub2 + sub3 + sub4;
            let per = total / 4;

            let grade = "";

            if (per >= 90) grade = "A+";
            else if (per >= 75) grade = "A";
            else if (per >= 60) grade = "B";
            else if (per >= 50) grade = "C";
            else grade = "Fail";

            document.getElementById("result").innerHTML =
                "<h2>Result</h2>" +
                "<p><b>Name:</b> " + name + "</p>" +
                "<p><b>Total:</b> " + total + "</p>" +
                "<p><b>Percentage:</b> " + per.toFixed(2) + "%</p>" +
                "<p><b>Grade:</b> " + grade + "</p>";
        }
    </script>

</body>

</html>
