<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 to N</title>
</head>

<body>
    <script>
        var n1 = parseInt(prompt("Enter first number:"));
        var n2 = parseInt(prompt("Enter second number:"));

        document.write("<h3>Even Numbers:</h3>");
        for (var i = n1; i <= n2; i++) {
            if (i % 2 == 0) {
                document.write(i + " ");
            }
        }

        document.write("<h3><br>Odd Numbers:</h3>");
        for (var i = n1; i <= n2; i++) {
            if (i % 2 != 0) {
                document.write(i + " ");
            }
        }
    </script>
</body>

</html>
