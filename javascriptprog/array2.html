<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Array</title>
</head>

<body>
    <script>

        var n = parseInt(prompt("Enter number of elements:"));
        var arr = [];

        for (var i = 0; i < n; i++) {
            arr[i] = prompt("Enter element:");
        }

        document.write("<h3>Array Elements in Reverse Order</h3>");

        arr.reverse().forEach(function (element) {
            document.write(element + "<br>");
        });

    </script>
</body>

</html>
