<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum of digit</title>
</head>

<body>
    <script>
        var num = parseInt(prompt("Enter a number:"));
        var sum = 0;
        var rem;

        while (num > 0) {
            rem = num % 10;
            sum += rem;
            num = parseInt(num / 10);
        }

        document.write("Sum of digits = " + sum);
    </script>
</body>

</html>
