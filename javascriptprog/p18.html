<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var rows = prompt("Enter number of rows:");

        for (var i = 1; i <= rows; i++) {

            for (var s = 1; s <= rows - i; s++) {
                document.write("&nbsp;&nbsp;");
            }

            for (var j = 1; j <= i; j++) {
                document.write(String.fromCharCode(64 + j) + " ");
            }

            for (var j = i - 1; j >= 1; j--) {
                document.write(String.fromCharCode(64 + j) + " ");
            }

            document.write("<br/>");
        }

        for (var i = rows - 1; i >= 1; i--) {

            for (var s = 1; s <= rows - i; s++) {
                document.write("&nbsp;&nbsp;");
            }

            for (var j = 1; j <= i; j++) {
                document.write(String.fromCharCode(64 + j) + " ");
            }

            for (var j = i - 1; j >= 1; j--) {
                document.write(String.fromCharCode(64 + j) + " ");
            }

            document.write("<br/>");
        }
    </script>
</body>

</html>
