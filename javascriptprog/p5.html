<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
        var rows = prompt("Enter the number of rows for P5:");

        for (var i = 1; i <= rows; i++) {
            for (var j = i; j >= 1; j--) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>
</body>

</html>
