<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var rows = prompt("Enter the number of rows for P3:");

        for (var i = 1; i <= rows; i++) {
            for (var j = rows; j >= (rows - i + 1); j--) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>
</body>

</html>
