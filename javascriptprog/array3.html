<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        var n = parseInt(prompt("Enter number of elements:"));
        var arr1 = [];
        var arr2 = [];

        for (var i = 0; i < n; i++) {
            arr1[i] = prompt("Enter value for index " + i);
        }

        arr1.forEach(function (element) {
            arr2.push(element);
        });

        document.write("<h3>Array</h3>");
        arr1.forEach(function (element) {
            document.write(element + "<br>");
        });

        document.write("<h3>Copy Array</h3>");
        arr2.forEach(function (element) {
            document.write(element + "<br>");
        });

    </script>

</body>

</html>
