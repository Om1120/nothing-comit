<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial;
        }

        table {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        td {
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }

        td:hover {
            background-color: #e0e0e0;
        }

        input {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>

</head>

<body>

    <table align="center" border="2px" cellpadding="30px">
        <tr>
            <td colspan="4">
                <input type="text" id="result" style="width: 100%; font-size: 20px;" readonly>
            </td>
        </tr>

        <tr>
            <td onclick="addValue('1')">1</td>
            <td onclick="addValue('2')">2</td>
            <td onclick="addValue('3')">3</td>
            <td onclick="setOperator('+')">+</td>
        </tr>

        <tr>
            <td onclick="addValue('4')">4</td>
            <td onclick="addValue('5')">5</td>
            <td onclick="addValue('6')">6</td>
            <td onclick="setOperator('-')">-</td>
        </tr>

        <tr>
            <td onclick="addValue('7')">7</td>
            <td onclick="addValue('8')">8</td>
            <td onclick="addValue('9')">9</td>
            <td onclick="setOperator('*')">*</td>
        </tr>

        <tr>
            <td colspan="3" onclick="addValue('0')">0</td>
            <td onclick="calculate()">=</td>
        </tr>

    </table>

<script>
    var first = "";
    var second = "";
    var operator = "";

    function addValue(val) {
        if (operator === "") {
            first += val;
            document.getElementById("result").value = first;
        } else {
            second += val;
            document.getElementById("result").value = first + operator + second;
        }
    }

    function setOperator(op) {

        if (first !== "" && second !== "") {
            calculate();
        }

        if (first !== "") {
            operator = op;
            document.getElementById("result").value = first + operator;
        }
    }

    function calculate() {
        var num1 = Number(first);
        var num2 = Number(second);
        var result = 0;

        if (operator === "+") {
            result = num1 + num2;
        }
        else if (operator === "-") {
            result = num1 - num2;
        }
        else if (operator === "*") {
            result = num1 * num2;
        }

        document.getElementById("result").value = result;

        first = result.toString();
        second = "";
        operator = "";
    }
</script>

</body>

</html>
