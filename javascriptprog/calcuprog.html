<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        table {
            border-radius: 10px;
        }

        td {
            border-radius: 8px;
            cursor: pointer;
        }

        input {
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <table align="center" border="2" cellpadding="30">
        <tr>
            <td colspan="3">
                <input type="text" id="result" readonly>
            </td>
            <td onclick="rem()">C</td>
        </tr>

        <tr>
            <td onclick="addValue('1')">1</td>
            <td onclick="addValue('2')">2</td>
            <td onclick="addValue('3')">3</td>
            <td onclick="addValue('+')">+</td>
        </tr>

        <tr>
            <td onclick="addValue('4')">4</td>
            <td onclick="addValue('5')">5</td>
            <td onclick="addValue('6')">6</td>
            <td onclick="addValue('-')">-</td>
        </tr>

        <tr>
            <td onclick="addValue('7')">7</td>
            <td onclick="addValue('8')">8</td>
            <td onclick="addValue('9')">9</td>
            <td onclick="addValue('*')">*</td>
        </tr>

        <tr>
            <td colspan="2" onclick="addValue('0')">0</td>
            <td onclick="addValue('/')">/</td>
            <td onclick="addValue('%')">%</td>
        </tr>

        <tr>
            <td colspan="4" onclick="calculate()">=</td>
        </tr>
    </table>

    <script>
        var data;
        var ans;

        function addValue(val) {
            document.getElementById("result").value += val;
        }

        function calculate() {
            data = document.getElementById("result").value;

            var numbers = data.split(/[\+\-\*\/\%]/);
            var operators = data.replace(/[0-9]/g, "").split("");

            ans = parseFloat(numbers[0]);

            for (var i = 0; i < operators.length; i++) {
                var num = parseFloat(numbers[i + 1]);

                if (operators[i] == "+") {
                    ans = ans + num;
                }
                else if (operators[i] == "-") {
                    ans = ans - num;
                }
                else if (operators[i] == "*") {
                    ans = ans * num;
                }
                else if (operators[i] == "/") {
                    ans = ans / num;
                }
                else if (operators[i] == "%") {
                    ans = ans % num;
                }
            }

            document.getElementById("result").value = ans;
        }

        function rem() {
            document.getElementById("result").value = "";
        }
    </script>

</body>

</html>
