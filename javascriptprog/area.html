<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>area</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>

        var s=5,area=s*s;
        document.write("Area of square is : ",area)

        var l=5,b=25,area=l*b;
        document.write("<br>Area of rectangle is : ",area);

        const pi=3.14;
        var r=10,area=pi*r*r;
        document.write("<br>Area of circle is : ",area);

        area=2*pi*r;
        document.write("<br>Circumferance is : ",area);
    </script>
</body>
</html>
