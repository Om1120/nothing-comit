<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        var n1 = parseInt(prompt("Enter number of elements for first array:"));
        var arr1 = [];

        for (var i = 0; i < n1; i++) {
            arr1[i] = prompt("Enter value for first array index " + i);
        }

        var n2 = parseInt(prompt("Enter number of elements for second array:"));
        var arr2 = [];

        for (var i = 0; i < n2; i++) {
            arr2[i] = prompt("Enter value for second array index " + i);
        }

        var arr3 = [];

        arr1.forEach(function (element) {
            arr3.push(element);
        });

        arr2.forEach(function (element) {
            arr3.push(element);
        });

        document.write("<h3>First Array</h3>");
        arr1.forEach(function (element) {
            document.write(element + "<br>");
        });

        document.write("<h3>Second Array</h3>");
        arr2.forEach(function (element) {
            document.write(element + "<br>");
        });

        document.write("<h3>Merged Array</h3>");
        arr3.forEach(function (element) {
            document.write(element + "<br>");
        });

    </script>
</body>

</html>
