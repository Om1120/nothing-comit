<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 to N prime</title>
</head>

<body>
    <script>
        var n = parseInt(prompt("Enter value of n:"));
        var i, j, count;

        document.write("Prime numbers from 1 to " + n + " are:<br><br>");

        for (i = 1; i <= n; i++) {
            count = 0;

            for (j = 1; j <= i; j++) {
                if (i % j == 0) {
                    count++;
                }
            }

            if (count == 2) {
                document.write(i + "<br>");
            }
        }
    </script>
</body>

</html>
