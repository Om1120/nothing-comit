<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Number</title>
</head>
<body>
    <script>
    var num = parseInt(prompt("Enter a number:"));
    var reverse = 0;
    var rem;

    while (num > 0) 
    {
        rem = num % 10;
        reverse = reverse * 10 + rem;
        num = parseInt(num / 10);
    }

    document.write("Reverse Number = " + reverse);
</script>
</body>
</html>
