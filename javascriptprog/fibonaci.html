<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonaci series </title>
</head>
<body>
    <script>
        var n = parseInt(prompt("Enter the number of terms for Fibonacci series:"));
        var a = 0, b = 1, temp;

        document.write("<h2>Fibonacci Series:</h2>");
        for (var i = 1; i <= n; i++) {
            document.write(a + "<br>");
            temp = a + b;
            a = b;
            b = temp;
        }
    </script>
</body>
</html>
