<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min and Max of two number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter first number:"));
        var b = parseInt(prompt("Enter second number:"));
        var c = parseInt(prompt("Enter third number:"));
        var d = parseInt(prompt("Enter fourth number:"));

        var min;
        var max;

        if (a <= b && a <= c && a <= d) {
            min = a;
        } else if (b <= a && b <= c && b <= d) {
            min = b;
        } else if (c <= a && c <= b && c <= d) {
            min = c;
        } else {
            min = d;
        }

        if (a >= b && a >= c && a >= d) {
            max = a;
        } else if (b >= a && b >= c && b >= d) {
            max = b;
        } else if (c >= a && c >= b && c >= d) {
            max = c;
        } else {
            max = d;
        }

        document.write("Minimum value = " + min + "<br>");
        document.write("Maximum value = " + max);
    </script>
</body>

</html>
