<!DOCTYPE html>
<html>

<head>
    <title>Tic Tac Toe</title>
</head>

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        background: #0b0b0b;
        font-family: Arial;
        margin: 0;
    }

    table {
        border-spacing: 10px;
    }

    td {
        width: 90px;
        height: 90px;
        background: #111;
        border: 2px solid #ff2e63;
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        color: #00ff9f;
        box-shadow: 0 0 10px #ff2e63;
    }

    td:hover {
        background: #1a1a1a;
         border: 2px solid #00ff9f;
        box-shadow: 0 0 20px #00ff9f;
    }

    h1 {
        color: #ff2e63;
        text-shadow: 0 0 15px #ff2e63;
    }

    h1:hover {
        color: #00ff9f;
        text-shadow: 0 0 20px #00ff9f;
    }

    #result {
        margin-top: 20px;
        font-size: 26px;
        color: #00ff9f;
        font-weight: bold;
        text-shadow: 0 0 10px #00ff9f;
    }

    button {
        margin-top: 15px;
        padding: 10px 25px;
        font-size: 18px;
        background: transparent;
        color: #ff2e63;
        border: 2px solid #ff2e63;
        cursor: pointer;
        border-radius: 5px;
        transition: 0.3s;
        box-shadow: 0 0 10px #ff2e63;
    }

    button:hover {
        background: #00ff9f;
         border: 2px solid #00ff9f;
        color: black;
        box-shadow: 0 0 20px #00ff9f;
    }
</style>

<body>
    <table>
        <tr>
            <th colspan="3">
                <h1>Tick Tack Toe</h1>
            </th>
        </tr>
        <tr>
            <td onclick="play(this,0)"></td>
            <td onclick="play(this,1)"></td>
            <td onclick="play(this,2)"></td>
        </tr>
        <tr>
            <td onclick="play(this,3)"></td>
            <td onclick="play(this,4)"></td>
            <td onclick="play(this,5)"></td>
        </tr>
        <tr>
            <td onclick="play(this,6)"></td>
            <td onclick="play(this,7)"></td>
            <td onclick="play(this,8)"></td>
        </tr>
    </table>

    <div id="result"></div>

    <button onclick="reset()">Restart Game</button>

    <script>
        let turn = "O";

        let b0 = "", b1 = "", b2 = "", b3 = "", b4 = "", b5 = "", b6 = "", b7 = "", b8 = "";

        function play(box, index) {

            if (box.innerHTML === "") {

                box.innerHTML = turn;

                if (index == 0) b0 = turn;
                if (index == 1) b1 = turn;
                if (index == 2) b2 = turn;
                if (index == 3) b3 = turn;
                if (index == 4) b4 = turn;
                if (index == 5) b5 = turn;
                if (index == 6) b6 = turn;
                if (index == 7) b7 = turn;
                if (index == 8) b8 = turn;

                checkWin();

                if (turn == "X") {
                    turn = "O";
                } else {
                    turn = "X";
                }
            }
        }

        function checkWin() {

            if (b0 != "" && b0 == b1 && b1 == b2) win(b0);
            else if (b3 != "" && b3 == b4 && b4 == b5) win(b3);
            else if (b6 != "" && b6 == b7 && b7 == b8) win(b6);

            else if (b0 != "" && b0 == b3 && b3 == b6) win(b0);
            else if (b1 != "" && b1 == b4 && b4 == b7) win(b1);
            else if (b2 != "" && b2 == b5 && b5 == b8) win(b2);

            else if (b0 != "" && b0 == b4 && b4 == b8) win(b0);
            else if (b2 != "" && b2 == b4 && b4 == b6) win(b2);

            else if (b0 != "" && b1 != "" && b2 != "" &&
                b3 != "" && b4 != "" && b5 != "" &&
                b6 != "" && b7 != "" && b8 != "") {
                document.getElementById("result").innerHTML = "Draw";
                setTimeout(reset, 1500);
            }
        }

        function win(player) {
            document.getElementById("result").innerHTML = player + " wins";
            setTimeout(reset, 2500);
        }

        function reset() {

            b0 = b1 = b2 = b3 = b4 = b5 = b6 = b7 = b8 = "";

            let cells = document.getElementsByTagName("td");

            for (let i = 0; i < cells.length; i++) {
                cells[i].innerHTML = "";
            }

            document.getElementById("result").innerHTML = "";

            turn = "O";
        }
    </script>

</body>

</html>
