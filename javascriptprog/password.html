<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password in do while loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        var password = "secret123";
        var userPassword;
        var attempts = 0;
        const maxAttempts = 3;

        do {
            userPassword = prompt("Enter the password:");
            attempts++;
            if (userPassword === password) {
                alert("Correct password! Welcome.");
                break;
            } else {
                alert("Incorrect password. Please try again.");
            }
        } while (attempts < maxAttempts && userPassword !== password);

        if (attempts >= maxAttempts && userPassword !== password) {
            alert("Too many failed attempts. Access denied.");
        }
    </script>
</body>
</html>
