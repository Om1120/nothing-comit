<!DOCTYPE html>
<html>

<head>
    <title>Puzzle Game</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            margin: 0;
            flex-direction: column;
            color: white;
        }

        table {
            font-size: 30px;
            border-collapse: collapse;
            background-color: #1f1f1f;
            border-radius: 15px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 6px solid #00bcd4;
        }

        td {
            width: 80px;
            height: 80px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: #fff;
            font-weight: bold;
            border: 2px solid #2c2c2c;
        }

        td:hover {
            transform: scale(1.0);
            background: linear-gradient(135deg, #00acc1, #00796b);
        }

        .empty {
            background: #333;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            cursor: default;
        }

        button {
            margin-top: 25px;
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00bcd4, #03a9f4);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(135deg, #0288d1, #0277bd);
        }

        #winMsg {
            margin-top: 20px;
            font-size: 24px;
            color: #00e676;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <table border="8px" align="center" cellpadding="40px">
        <tr>
            <td onclick="move(0)">2</td>
            <td onclick="move(1)">8</td>
            <td onclick="move(2)">3</td>
        </tr>
        <tr>
            <td onclick="move(3)">1</td>
            <td onclick="move(4)">6</td>
            <td onclick="move(5)">4</td>
        </tr>
        <tr>
            <td onclick="move(6)">7</td>
            <td onclick="move(7)">5</td>
            <td onclick="move(8)" class="empty"></td>
        </tr>
    </table>

    <button onclick="resetGame()">Reset</button>

    <div id="winMsg"></div>

    <script>
        let box = document.getElementsByTagName("td");

        function move(i) {

            if (i == 0) {
                if (box[1].innerText == "") swap(0, 1);
                else if (box[3].innerText == "") swap(0, 3);
            }

            else if (i == 1) {
                if (box[0].innerText == "") swap(1, 0);
                else if (box[2].innerText == "") swap(1, 2);
                else if (box[4].innerText == "") swap(1, 4);
            }

            else if (i == 2) {
                if (box[1].innerText == "") swap(2, 1);
                else if (box[5].innerText == "") swap(2, 5);
            }

            else if (i == 3) {
                if (box[0].innerText == "") swap(3, 0);
                else if (box[4].innerText == "") swap(3, 4);
                else if (box[6].innerText == "") swap(3, 6);
            }

            else if (i == 4) {
                if (box[1].innerText == "") swap(4, 1);
                else if (box[3].innerText == "") swap(4, 3);
                else if (box[5].innerText == "") swap(4, 5);
                else if (box[7].innerText == "") swap(4, 7);
            }

            else if (i == 5) {
                if (box[2].innerText == "") swap(5, 2);
                else if (box[4].innerText == "") swap(5, 4);
                else if (box[8].innerText == "") swap(5, 8);
            }

            else if (i == 6) {
                if (box[3].innerText == "") swap(6, 3);
                else if (box[7].innerText == "") swap(6, 7);
            }

            else if (i == 7) {
                if (box[6].innerText == "") swap(7, 6);
                else if (box[4].innerText == "") swap(7, 4);
                else if (box[8].innerText == "") swap(7, 8);
            }

            else if (i == 8) {
                if (box[5].innerText == "") swap(8, 5);
                else if (box[7].innerText == "") swap(8, 7);
            }

            checkWin();
        }

        function swap(a, b) {
            let temp = box[a].innerText;
            box[a].innerText = box[b].innerText;
            box[b].innerText = temp;
        }

        function resetGame() {
            let values = ["2", "8", "3", "1", "6", "4", "7", "5", ""];
            for (let i = 0; i < box.length; i++) {
                box[i].innerText = values[i];
            }
            document.getElementById("winMsg").innerText = "";
        }

        function checkWin() {
            let win = ["1", "2", "3", "4", "5", "6", "7", "8", ""];
            for (let i = 0; i < box.length; i++) {
                if (box[i].innerText != win[i]) return;
            }
            document.getElementById("winMsg").innerText = "You Win 🎉";
        }
    </script>

</body>

</html>
