 <!-- new program -->
  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JavaScript Example</title>
</head>
<body>

<script>

alert("Hello World!");

if(confirm("Do you want to continue?")) {
    alert("You chose to continue.");
} 
else {
    alert("You chose to cancel.");
}


// Array Example
var data = new Array("Apple","Banana","Cherry","Chiku","Mango","Grapes","Orange","Watermelon","Papaya","Kiwi");

document.write("<h3>Fruits List</h3>");

data.forEach(function(element){
    document.write(element + "<br>");
});


// Blank Array Example
var arr = [];

for (var i = 0; i < 5; i++) {
    arr[i] = prompt("Enter value for index " + i);
}

document.write("<h3>User Entered Values</h3>");

arr.forEach(function(element){
    document.write(element + "<br>");
});


// UDF Example (with argument with return value)
function sum(a,b) {
    return a + b;
}

var d = sum(10,200);

document.write("<h3>Sum is : " + d + "</h3>");

</script>

</body>
</html>
